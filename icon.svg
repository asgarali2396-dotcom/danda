<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="shoeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Subtle Radial Ambient Glow -->
  <circle cx="160" cy="160" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>

  <!-- Dynamic Footwear / Sneaker Silhouette -->
  <g transform="translate(60, 160)">
    <!-- Sole Foundation -->
    <path d="M 50 185 C 80 185, 120 190, 160 178 C 200 166, 240 185, 300 185 C 330 185, 345 170, 345 155 C 345 145, 330 145, 290 145 C 220 145, 180 135, 140 145 C 100 155, 60 150, 40 160 C 35 168, 40 185, 50 185 Z" fill="#94a3b8"/>
    <!-- Sole tread detail -->
    <path d="M 55 182 L 335 182" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

    <!-- Sneaker Upper Body -->
    <path d="M 50 155 C 45 120, 70 85, 105 85 C 120 85, 135 110, 165 115 C 210 120, 245 130, 280 132 C 315 134, 340 142, 342 155 Z" fill="url(#shoeGrad)"/>

    <!-- Dynamic Sport Stripe / Accent (Emerald) -->
    <path d="M 115 95 C 150 125, 220 138, 285 140" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M 135 115 C 170 135, 225 145, 270 146" stroke="#10b981" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Laces Details -->
    <path d="M 145 92 L 160 102 M 170 98 L 185 108 M 195 104 L 210 114" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 20% Profit Badge (Top Right) -->
  <g transform="translate(340, 70)">
    <circle cx="50" cy="50" r="48" fill="url(#emeraldGrad)" filter="url(#glow)"/>
    <circle cx="50" cy="50" r="48" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.4"/>
    <!-- Growth Arrow & Text -->
    <path d="M 50 68 L 50 32 M 38 44 L 50 32 L 62 44" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="0.5">20%</text>
  </g>

  <!-- Label Bottom: SoleLedger -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#f8fafc" letter-spacing="3">SOLELEDGER</text>
  <text x="256" y="468" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#10b981" letter-spacing="1">FOOTWEAR SALES &amp; PROFIT</text>
</svg>
